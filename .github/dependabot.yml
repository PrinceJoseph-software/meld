# Keeps dependencies patched. Updates arrive as grouped pull requests once a month.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: gradle
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups: { android: { patterns: ["*"], update-types: ["minor", "patch"] } }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: monthly }
    groups: { web: { patterns: ["*"], update-types: ["minor", "patch"] } }
  - package-ecosystem: npm
    directory: /rules-tests
    schedule: { interval: monthly }
    groups: { rules-tests: { patterns: ["*"] } }
