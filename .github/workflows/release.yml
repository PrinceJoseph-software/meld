name: Release APK

on:
  push:
    tags:
      - 'v*'
  # Rebuild a release from the Actions tab: choose "Use workflow from: Tags → vX.Y.Z".
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --console=plain

      # The SAME upload key must sign every release, otherwise Android refuses to
      # install an update over the previous version. See docs/RELEASING.md.
      - name: Restore upload keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing. See docs/RELEASING.md"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-key.jks"

      - name: Restore Firebase config (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON not set - building without cloud sync"
          fi

      - name: Build signed release APK and AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VERSION_NAME: ${{ github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}
          MELD_WEB_BASE_URL: ${{ vars.MELD_WEB_BASE_URL }}
        run: |
          export VERSION_NAME="${VERSION_NAME#v}"
          ./gradlew assembleRelease bundleRelease --no-daemon --console=plain
          cp app/build/outputs/apk/release/app-release.apk "meld-${VERSION_NAME}.apk"

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            meld-*.apk
            app/build/outputs/bundle/release/app-release.aab
          generate_release_notes: true
